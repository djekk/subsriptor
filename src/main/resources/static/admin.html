<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .orders-wrap {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            margin-top: 16px;
            overflow-x: auto;
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 980px;
        }
        .orders-table th, .orders-table td {
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            padding: 10px 8px;
            font-size: 14px;
        }
        .orders-table th {
            color: #374151;
            background: #f9fafb;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>Admin Panel</h1>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="#" id="logoutBtn" class="nav-link">Logout</a>
                <span id="usernameSpan" style="color: white; margin-left: 10px;"></span>
            </div>
        </div>

        <div class="content">
            <h2>Orders</h2>
            <div id="adminMessage" class="message" style="display:none;"></div>
            <div class="orders-wrap">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>User</th>
                            <th>Device</th>
                            <th>Product</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th>Provider</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <tr><td colspan="8">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showMessage(text, type) {
            var box = document.getElementById('adminMessage');
            box.style.display = 'block';
            box.className = 'message ' + (type || '');
            box.textContent = text;
        }

        function formatCurrency(value) {
            return '$' + Number(value || 0).toFixed(2);
        }

        function formatDate(value) {
            if (!value) {
                return '-';
            }
            return new Date(value).toLocaleString();
        }

        async function loadAdminOrders() {
            const sessionResp = await fetch('/api/auth/check-session');
            const sessionResult = await sessionResp.json();

            if (!sessionResp.ok || !sessionResult.success) {
                window.location.href = '/login';
                return;
            }

            const sessionData = sessionResult.data && typeof sessionResult.data === 'object'
                ? sessionResult.data
                : { username: sessionResult.data, role: 'USER' };

            if (sessionData.role !== 'ADMIN') {
                showMessage('Administrator access required.', 'error');
                setTimeout(function () {
                    window.location.href = '/dashboard';
                }, 1200);
                return;
            }

            const response = await fetch('/api/admin/orders');
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || 'Unable to load orders');
            }

            const orders = Array.isArray(result.data) ? result.data : [];
            const tbody = document.getElementById('ordersBody');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">No orders found.</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(function (order) {
                return [
                    '<tr>',
                    '<td>' + escapeHtml(order.orderNumber) + '</td>',
                    '<td>' + escapeHtml(order.username) + '</td>',
                    '<td>' + escapeHtml(order.deviceNumber) + '</td>',
                    '<td>' + escapeHtml(order.productCode) + ' / ' + escapeHtml(order.productVariant) + '</td>',
                    '<td>' + escapeHtml(order.status) + '</td>',
                    '<td>' + formatCurrency(order.totalAmount) + '</td>',
                    '<td>' + escapeHtml(order.paymentProvider) + '</td>',
                    '<td>' + formatDate(order.createdAt) + '</td>',
                    '</tr>'
                ].join('');
            }).join('');
        }

        loadAdminOrders().catch(function (error) {
            showMessage(error.message, 'error');
            document.getElementById('ordersBody').innerHTML = '<tr><td colspan="8">Unable to load orders.</td></tr>';
        });
    </script>
</body>
</html>
