<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 20px;
        }
        .admin-tab {
            border: none;
            border-bottom: 3px solid transparent;
            background: transparent;
            padding: 12px 20px;
            font: inherit;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
        }
        .admin-tab[aria-selected="true"] {
            border-bottom-color: #2563eb;
            color: #2563eb;
        }
        .admin-tab:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: -2px;
        }
        .admin-panel[hidden] {
            display: none;
        }
        .orders-wrap {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            margin-top: 16px;
            overflow-x: auto;
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 980px;
        }
        .orders-table th, .orders-table td {
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            padding: 10px 8px;
            font-size: 14px;
        }
        .orders-table th {
            color: #374151;
            background: #f9fafb;
            font-weight: 600;
        }
        .orders-pagination {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }
        .orders-pagination[hidden] {
            display: none;
        }
        .orders-pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .orders-search {
            margin-top: 16px;
            max-width: 480px;
        }
        .product-form {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            margin-top: 16px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-group-wide {
            grid-column: 1 / -1;
        }
        .field-group label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }
        .field-group input,
        .field-group textarea,
        .field-group select {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 14px;
            font-family: inherit;
        }
        .checkbox-group {
            justify-content: flex-end;
            align-items: flex-start;
            padding-top: 24px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .secondary-button,
        .product-form button,
        .product-delete-btn,
        .product-edit-btn {
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .product-form button {
            background: #2563eb;
            color: white;
        }
        .secondary-button {
            background: #e5e7eb;
            color: #111827;
        }
        .product-delete-btn {
            background: #ef4444;
            color: white;
            margin-left: 8px;
        }
        .product-edit-btn {
            background: #f59e0b;
            color: white;
        }
        .product-status-pill {
            display: inline-block;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
        }
        .product-status-active {
            background: #dcfce7;
            color: #166534;
        }
        .product-status-inactive {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>Admin Panel</h1>
            <div class="nav-links">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="#" id="logoutBtn" class="nav-link">Logout</a>
                <span id="usernameSpan" style="color: white; margin-left: 10px;"></span>
            </div>
        </div>

        <div class="content">
            <div id="adminMessage" class="message" style="display:none;"></div>
            <div class="admin-tabs" role="tablist" aria-label="Admin sections">
                <button type="button" id="ordersTab" class="admin-tab" role="tab" aria-selected="true" aria-controls="ordersPanel">Orders</button>
                <button type="button" id="productsTab" class="admin-tab" role="tab" aria-selected="false" aria-controls="productsPanel" tabindex="-1">Products</button>
            </div>
            <section id="ordersPanel" class="admin-panel" role="tabpanel" aria-labelledby="ordersTab" tabindex="0">
            <h2>Orders</h2>
            <div class="field-group orders-search">
                <label for="ordersSearch">Search orders</label>
                <input id="ordersSearch" type="search" placeholder="Email, device number, or order #" aria-controls="ordersBody">
                <span id="ordersSearchInfo" aria-live="polite"></span>
            </div>
            <div class="orders-wrap">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>User / Email</th>
                            <th>Device</th>
                            <th>Product</th>
                            <th>Status</th>
                            <th>Total</th>
                            <th>Provider</th>
                            <th>Created</th>
                            <th>Expires At</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <tr><td colspan="9">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            <nav id="ordersPagination" class="orders-pagination" aria-label="Orders pagination" hidden>
                <button type="button" id="ordersPreviousBtn" class="secondary-button" disabled>Previous</button>
                <span id="ordersPageInfo" aria-live="polite"></span>
                <button type="button" id="ordersNextBtn" class="secondary-button" disabled>Next</button>
            </nav>
            </section>

            <section id="productsPanel" class="admin-panel" role="tabpanel" aria-labelledby="productsTab" tabindex="0" hidden>
            <h2>Products</h2>
            <div id="productMessage" class="message" style="display:none;"></div>
            <form id="productForm" class="product-form">
                <input type="hidden" id="productId" name="productId">
                <div class="product-grid">
                    <div class="field-group">
                        <label for="productCode">Code</label>
                        <input id="productCode" name="code" type="text" required>
                    </div>
                    <div class="field-group">
                        <label for="productName">Name</label>
                        <input id="productName" name="name" type="text" required>
                    </div>
                    <div class="field-group">
                        <label for="productType">Type</label>
                        <select id="productType" name="productType" required>
                            <option value="SUBSCRIPTION">SUBSCRIPTION</option>
                      <!--      <option value="TOKEN">TOKEN</option>-->
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="productVariant">Variant</label>
                        <input id="productVariant" name="variant" type="text">
                    </div>
                    <div class="field-group">
                        <label for="productPrice">Price</label>
                        <input id="productPrice" name="price" type="number" min="0" step="0.01" required>
                    </div>
                    <div class="field-group">
                        <label for="productSortOrder">Sort Order</label>
                        <input id="productSortOrder" name="sortOrder" type="number" min="0" step="1" value="0">
                    </div>
                    <div class="field-group field-group-wide">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" name="description" rows="3"></textarea>
                    </div>
                    <div class="field-group checkbox-group">
                        <label for="productActive">Active</label>
                        <input id="productActive" name="active" type="checkbox" checked>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="saveProductBtn">Add Product</button>
                    <button type="button" id="cancelProductBtn" class="secondary-button" style="display:none;">Cancel</button>
                </div>
            </form>

            <div class="orders-wrap" style="margin-top: 28px;">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Variant</th>
                            <th>Price</th>
                            <th>Order</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody">
                        <tr><td colspan="9">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            </section>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const adminTabs = Array.from(document.querySelectorAll('.admin-tab'));

        function selectAdminTab(selectedTab) {
            adminTabs.forEach(function (tab) {
                const selected = tab === selectedTab;
                tab.setAttribute('aria-selected', String(selected));
                tab.tabIndex = selected ? 0 : -1;
                document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
            });
        }

        adminTabs.forEach(function (tab, index) {
            tab.addEventListener('click', function () {
                selectAdminTab(tab);
            });
            tab.addEventListener('keydown', function (event) {
                let nextIndex;
                if (event.key === 'ArrowRight') {
                    nextIndex = (index + 1) % adminTabs.length;
                } else if (event.key === 'ArrowLeft') {
                    nextIndex = (index - 1 + adminTabs.length) % adminTabs.length;
                } else if (event.key === 'Home') {
                    nextIndex = 0;
                } else if (event.key === 'End') {
                    nextIndex = adminTabs.length - 1;
                } else {
                    return;
                }
                event.preventDefault();
                selectAdminTab(adminTabs[nextIndex]);
                adminTabs[nextIndex].focus();
            });
        });

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showMessage(text, type) {
            var box = document.getElementById('adminMessage');
            box.style.display = 'block';
            box.className = 'message ' + (type || '');
            box.textContent = text;
        }

        function showProductMessage(text, type) {
            var box = document.getElementById('productMessage');
            box.style.display = 'block';
            box.className = 'message ' + (type || '');
            box.textContent = text;
        }

        function formatCurrency(value) {
            return '$' + Number(value || 0).toFixed(2);
        }

        function formatDate(value) {
            if (!value) {
                return '-';
            }
            return new Date(value).toLocaleString();
        }

        function clearProductForm() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productActive').checked = true;
            document.getElementById('productSortOrder').value = 0;
            document.getElementById('saveProductBtn').textContent = 'Add Product';
            document.getElementById('cancelProductBtn').style.display = 'none';
        }

        function populateProductForm(product) {
            document.getElementById('productId').value = product.id || '';
            document.getElementById('productCode').value = product.code || '';
            document.getElementById('productName').value = product.name || '';
            document.getElementById('productType').value = product.productType || 'SUBSCRIPTION';
            document.getElementById('productVariant').value = product.variant || '';
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productPrice').value = product.price || '';
            document.getElementById('productSortOrder').value = product.sortOrder || 0;
            document.getElementById('productActive').checked = product.active !== false;
            document.getElementById('saveProductBtn').textContent = 'Update Product';
            document.getElementById('cancelProductBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getProductPayload() {
            return {
                code: document.getElementById('productCode').value.trim(),
                name: document.getElementById('productName').value.trim(),
                productType: document.getElementById('productType').value,
                variant: document.getElementById('productVariant').value.trim() || null,
                description: document.getElementById('productDescription').value.trim() || null,
                price: Number(document.getElementById('productPrice').value),
                sortOrder: Number(document.getElementById('productSortOrder').value || 0),
                active: document.getElementById('productActive').checked
            };
        }

        async function ensureAdminSession() {
            const sessionResp = await fetch('/api/auth/check-session');
            const sessionResult = await sessionResp.json();

            if (!sessionResp.ok || !sessionResult.success) {
                window.location.href = '/login';
                return null;
            }

            const sessionData = sessionResult.data && typeof sessionResult.data === 'object'
                ? sessionResult.data
                : { username: sessionResult.data, role: 'USER' };

            if (sessionData.role !== 'ADMIN') {
                showMessage('Administrator access required.', 'error');
                setTimeout(function () {
                    window.location.href = '/dashboard';
                }, 1200);
                return null;
            }

            const usernameSpan = document.getElementById('usernameSpan');
            if (usernameSpan) {
                usernameSpan.textContent = sessionData.username || 'Admin';
            }
            return sessionData;
        }

        async function loadAdminProducts() {
            const response = await fetch('/api/admin/products');
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || 'Unable to load products');
            }

            const products = Array.isArray(result.data) ? result.data : [];
            window.adminProducts = products;
            const tbody = document.getElementById('productsBody');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9">No products found.</td></tr>';
                return;
            }

            tbody.innerHTML = products.map(function (product) {
                return [
                    '<tr>',
                    '<td>' + escapeHtml(product.id) + '</td>',
                    '<td>' + escapeHtml(product.code) + '</td>',
                    '<td>' + escapeHtml(product.name) + '</td>',
                    '<td>' + escapeHtml(product.productType) + '</td>',
                    '<td>' + escapeHtml(product.variant || '-') + '</td>',
                    '<td>' + formatCurrency(product.price) + '</td>',
                    '<td>' + escapeHtml(product.sortOrder || 0) + '</td>',
                    '<td><span class="product-status-pill ' + (product.active === false ? 'product-status-inactive' : 'product-status-active') + '">' + (product.active === false ? 'Inactive' : 'Active') + '</span></td>',
                    '<td>' +
                    '<button type="button" class="product-edit-btn" data-id="' + escapeHtml(product.id) + '">Edit</button>' +
                    '<button type="button" class="product-delete-btn" data-id="' + escapeHtml(product.id) + '">Delete</button>' +
                    '</td>',
                    '</tr>'
                ].join('');
            }).join('');
        }

        const ordersPageSize = 10;
        let adminOrders = [];
        let ordersPage = 0;

        function renderAdminOrders() {
            const query = document.getElementById('ordersSearch').value.trim().toLowerCase();
            const filteredOrders = adminOrders.filter(function (order) {
                return [order.email, order.deviceNumber, order.orderNumber].some(function (value) {
                    return String(value || '').toLowerCase().includes(query);
                });
            });
            document.getElementById('ordersSearchInfo').textContent = query
                ? filteredOrders.length + ' matching orders'
                : '';
            const totalPages = Math.ceil(filteredOrders.length / ordersPageSize);
            ordersPage = Math.max(0, Math.min(ordersPage, totalPages - 1));
            const start = ordersPage * ordersPageSize;
            const orders = filteredOrders.slice(start, start + ordersPageSize);
            document.getElementById('ordersPagination').hidden = totalPages <= 1;
            document.getElementById('ordersPreviousBtn').disabled = ordersPage === 0;
            document.getElementById('ordersNextBtn').disabled = ordersPage >= totalPages - 1;
            document.getElementById('ordersPageInfo').textContent = filteredOrders.length === 0
                ? ''
                : 'Page ' + (ordersPage + 1) + ' of ' + totalPages +
                    ' (' + (start + 1) + '-' + (start + orders.length) + ' of ' + filteredOrders.length + ' orders)';

            const tbody = document.getElementById('ordersBody');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9">' +
                    (query ? 'No matching orders found.' : 'No orders found.') + '</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(function (order) {
                return [
                    '<tr>',
                    '<td>' + escapeHtml(order.orderNumber) + '</td>',
                    '<td>' + escapeHtml(order.username) + '<br>' + escapeHtml(order.email || '-') + '</td>',
                    '<td>' + escapeHtml(order.deviceNumber) + '</td>',
                    '<td>' + escapeHtml(order.productCode) + ' / ' + escapeHtml(order.productVariant) + '</td>',
                    '<td>' + escapeHtml(order.status) + '</td>',
                    '<td>' + formatCurrency(order.totalAmount) + '</td>',
                    '<td>' + escapeHtml(order.paymentProvider) + '</td>',
                    '<td>' + formatDate(order.createdAt) + '</td>',
                    '<td>' + formatDate(order.expiresAt) + '</td>',
                    '</tr>'
                ].join('');
            }).join('');
        }

        async function loadAdminOrders() {
            const response = await fetch('/api/admin/orders');
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || 'Unable to load orders');
            }

            adminOrders = Array.isArray(result.data) ? result.data : [];
            ordersPage = 0;
            renderAdminOrders();
        }

        document.getElementById('ordersPreviousBtn').addEventListener('click', function () {
            ordersPage -= 1;
            renderAdminOrders();
        });

        document.getElementById('ordersNextBtn').addEventListener('click', function () {
            ordersPage += 1;
            renderAdminOrders();
        });

        document.getElementById('ordersSearch').addEventListener('input', function () {
            ordersPage = 0;
            renderAdminOrders();
        });

        async function initializeAdminPage() {
            const session = await ensureAdminSession();
            if (!session) {
                return;
            }

            try {
                await Promise.all([loadAdminOrders(), loadAdminProducts()]);
            } catch (error) {
                showMessage(error.message, 'error');
                document.getElementById('ordersPagination').hidden = true;
                document.getElementById('ordersBody').innerHTML = '<tr><td colspan="9">Unable to load orders.</td></tr>';
                document.getElementById('productsBody').innerHTML = '<tr><td colspan="9">Unable to load products.</td></tr>';
            }
        }

        document.getElementById('productForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const productId = document.getElementById('productId').value;
            const payload = getProductPayload();
            const endpoint = productId ? '/api/admin/products/' + productId : '/api/admin/products';
            const method = productId ? 'PUT' : 'POST';

            const response = await fetch(endpoint, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (!response.ok || !result.success) {
                showProductMessage(result.message || 'Unable to save product.', 'error');
                return;
            }

            showProductMessage(productId ? 'Product updated successfully.' : 'Product added successfully.', 'success');
            clearProductForm();
            await loadAdminProducts();
        });

        document.getElementById('cancelProductBtn').addEventListener('click', function () {
            clearProductForm();
            showProductMessage('Product form reset.', 'success');
        });

        document.addEventListener('click', async function (event) {
            const editButton = event.target.closest('.product-edit-btn');
            if (editButton) {
                const selectedProduct = (window.adminProducts || []).find(function (product) {
                    return Number(product.id) === Number(editButton.dataset.id);
                });
                if (selectedProduct) {
                    populateProductForm(selectedProduct);
                }
                return;
            }

            const deleteButton = event.target.closest('.product-delete-btn');
            if (!deleteButton) {
                return;
            }

            const productId = deleteButton.dataset.id;
            if (!productId || !confirm('Delete this product?')) {
                return;
            }

            const response = await fetch('/api/admin/products/' + productId, {
                method: 'DELETE'
            });
            const result = await response.json();

            if (!response.ok || !result.success) {
                showProductMessage(result.message || 'Unable to delete product.', 'error');
                return;
            }

            showProductMessage('Product deleted successfully.', 'success');
            clearProductForm();
            await loadAdminProducts();
        });

        initializeAdminPage().catch(function (error) {
            showMessage(error.message, 'error');
            document.getElementById('ordersPagination').hidden = true;
            document.getElementById('ordersBody').innerHTML = '<tr><td colspan="9">Unable to load orders.</td></tr>';
            document.getElementById('productsBody').innerHTML = '<tr><td colspan="9">Unable to load products.</td></tr>';
        });
    </script>
</body>
</html>
