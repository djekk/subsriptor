<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>Alarm Service</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="nav-link">Register</a>
                <a href="#" id="logoutBtn" class="nav-link" style="display:none;">Logout</a>
                <span id="usernameSpan" style="display:none; color: white; margin-left: 10px;"></span>
            </div>
        </div>

        <div class="form-container">
            <div class="form-box">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                </form>

                <div id="loginMessage" class="message"></div>

                <p style="text-align: center; margin-top: 15px;">
                    Don't have an account? <a href="/register">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();
                const messageDiv = document.getElementById('loginMessage');

                if (result.success) {
                    sessionStorage.setItem('username', result.data.username);
                    messageDiv.className = 'message success';
                    messageDiv.textContent = result.message;
                    setTimeout(() => {
                        window.location.href = result.data.role === 'ADMIN' ? '/admin' : '/dashboard';
                    }, 1500);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.message;
                }
            } catch (error) {
                document.getElementById('loginMessage').className = 'message error';
                document.getElementById('loginMessage').textContent = 'An error occurred: ' + error.message;
            }
        });
    </script>
</body>
</html>
