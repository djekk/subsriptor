<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>Alarm Service</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="nav-link">Register</a>
                <a href="#" id="logoutBtn" class="nav-link" style="display:none;">Logout</a>
                <span id="usernameSpan" style="display:none; color: white; margin-left: 10px;"></span>
            </div>
        </div>

        <div class="form-container">
            <div class="form-box">
                <h2>Register</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName">
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName">
                    </div>

                    <div class="form-group">
                        <label for="regUsername">Username:</label>
                        <input type="text" id="regUsername" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password:</label>
                        <input type="password" id="regPassword" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Register</button>
                </form>

                <div id="registerMessage" class="message"></div>
                <p id="resendPrompt" style="display:none; text-align: center; margin-top: 15px;">
                    Already registered? <a href="/login">Use login</a> after verifying your email.
                </p>

                <p style="text-align: center; margin-top: 15px;">
                    Already have an account? <a href="/login">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                username: document.getElementById('regUsername').value,
                email: document.getElementById('email').value,
                password: document.getElementById('regPassword').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                const messageDiv = document.getElementById('registerMessage');

                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = result.message;
                    document.getElementById('resendPrompt').style.display = 'block';
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.message;
                }
            } catch (error) {
                document.getElementById('registerMessage').className = 'message error';
                document.getElementById('registerMessage').textContent = 'An error occurred: ' + error.message;
            }
        });
    </script>
</body>
</html>
