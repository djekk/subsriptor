spring:
  application:
    name: subscriptor
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/login_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

email-verification:
  base-url: ${SUBSCRIPTOR_HOST:http://localhost:8080}

server:
  port: 8080

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${SUBSCRIPTOR_HOST:}/payment/success?session_id={CHECKOUT_SESSION_ID}
  cancel-url: ${SUBSCRIPTOR_HOST:}/payment/cancel

order:
  confirmation-email:
    enabled: ${ORDER_CONFIRMATION_EMAIL_ENABLED:false}
    from: ${ORDER_CONFIRMATION_EMAIL_FROM:no-reply@subscriptor.local}
    admin-emails: ${ORDER_CONFIRMATION_EMAIL_ADMIN_EMAILS:}

subscription-check:
  request-aes-key: ${SUBSCRIPTION_CHECK_REQUEST_AES_KEY:}
  response-aes-key: ${SUBSCRIPTION_CHECK_RESPONSE_AES_KEY:}

logging:
  level:
    root: WARN
    com.application: INFO
    org.hibernate: WARN
