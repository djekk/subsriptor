spring:
  application:
    name: subscriptor
  datasource:
    url: jdbc:mysql://localhost:3306/login_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8080

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${SUBSCRIPTOR_HOST:}/payment/success?session_id={CHECKOUT_SESSION_ID}
  cancel-url: ${SUBSCRIPTOR_HOST:}/payment/cancel

subscription-check:
  request-aes-key: ${SUBSCRIPTION_CHECK_REQUEST_AES_KEY:1CFA7B20EE3D9B48227DBAA6739AE044}
  response-aes-key: ${SUBSCRIPTION_CHECK_RESPONSE_AES_KEY:DE0216CEF066E18B5AC877A43E982EF6}

logging:
  level:
    root: WARN
    com.application: INFO
    org.hibernate: WARN
